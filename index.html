<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Sword of Neramar</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#08061a;--bg-panel:#110d2a;--bg-card:#1a1538;
  --gold:#c9a227;--gold-light:#e8c84a;--gold-dim:#5a460f;
  --purple:#4a1a8a;--purple-dark:#2d0f5e;--purple-mid:#6b21a8;
  --crimson:#7a1010;--crimson-light:#c0392b;
  --text:#f0e6c8;--text-dim:#9987c2;
  --border:#2a1a55;--border-gold:#3a2a10;
}
body{
  background:var(--bg);color:var(--text);
  font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  height:100vh;display:flex;flex-direction:column;overflow:hidden;
  background-image:radial-gradient(ellipse at top,#1a0a3a 0%,#08061a 60%);
}
header{
  background:linear-gradient(135deg,#1c0a3a 0%,#0d1535 100%);
  border-bottom:2px solid var(--gold-dim);
  padding:12px 20px 10px;flex-shrink:0;
  box-shadow:0 4px 20px rgba(0,0,0,0.6);
}
h1{
  color:var(--gold-light);font-size:1.55rem;text-align:center;
  letter-spacing:4px;text-transform:uppercase;
  text-shadow:0 0 30px rgba(201,162,39,0.7),0 0 60px rgba(201,162,39,0.3);
  margin-bottom:10px;font-weight:normal;
}
h1 span{font-size:1.1rem;opacity:0.7;margin:0 8px}
#stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.stat{
  background:rgba(26,21,56,0.8);border:1px solid var(--border);
  border-radius:5px;padding:4px 14px;font-size:0.82rem;letter-spacing:1px;
  transition:color 0.3s;
}
.stat.hp{border-color:#1a5c30;color:#4ade80}
.stat.ar{border-color:#1a3a6e;color:#60a5fa}
.stat.gp{border-color:var(--gold-dim);color:var(--gold-light)}
.stat.wp{border-color:var(--crimson);color:#fca5a5}
#output{
  flex:1;overflow-y:auto;padding:16px 20px;
  display:flex;flex-direction:column;gap:6px;
  scrollbar-width:thin;scrollbar-color:var(--gold-dim) var(--bg);
}
#output::-webkit-scrollbar{width:5px}
#output::-webkit-scrollbar-track{background:var(--bg)}
#output::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:3px}
.msg{
  max-width:760px;width:100%;margin:0 auto;
  padding:8px 14px;border-radius:5px;line-height:1.65;font-size:0.93rem;
}
.story{
  color:var(--text);
  background:rgba(26,21,56,0.35);
  border-left:3px solid var(--purple);
}
.prompt{
  color:var(--gold-light);font-style:italic;
  background:rgba(26,21,56,0.6);
  border-left:3px solid var(--gold);
}
.echo{
  color:#fca5a5;font-weight:bold;
  background:rgba(120,16,16,0.18);
  border-left:3px solid var(--crimson);
}
.sys{
  color:var(--text-dim);font-style:italic;text-align:center;
  border:1px dashed var(--border);background:none;
}
.win{
  color:var(--gold-light);
  background:rgba(201,162,39,0.12);
  border:1px solid var(--gold-dim);
  text-align:center;font-size:1rem;
}
.die{
  color:#f87171;
  background:rgba(120,16,16,0.2);
  border:1px solid var(--crimson);
  text-align:center;
}
#bottom{
  flex-shrink:0;background:var(--bg-panel);
  border-top:2px solid var(--border);
  padding:10px 20px 14px;
}
#choices{
  display:flex;flex-wrap:wrap;gap:8px;
  justify-content:center;margin-bottom:10px;
  max-width:760px;margin-left:auto;margin-right:auto;
  min-height:38px;
}
.cbtn{
  background:linear-gradient(135deg,var(--purple-dark),#1a1030);
  color:var(--gold-light);border:1px solid var(--gold-dim);
  border-radius:5px;padding:7px 20px;font-size:0.88rem;
  font-family:inherit;cursor:pointer;letter-spacing:1px;
  transition:all 0.18s;text-transform:capitalize;
}
.cbtn:hover{
  background:linear-gradient(135deg,var(--purple-mid),var(--crimson));
  border-color:var(--gold-light);color:#fff;
  box-shadow:0 0 14px rgba(201,162,39,0.35);
  transform:translateY(-1px);
}
#input-row{
  display:flex;gap:10px;max-width:760px;margin:0 auto;
}
#user-input{
  flex:1;background:var(--bg-card);border:1px solid var(--border);
  border-radius:5px;color:var(--text);padding:9px 14px;
  font-size:0.92rem;font-family:inherit;outline:none;
  transition:border-color 0.2s;
}
#user-input:focus{border-color:var(--gold-dim)}
#user-input::placeholder{color:var(--text-dim);font-style:italic}
#submit-btn{
  background:linear-gradient(135deg,var(--purple-dark),var(--crimson));
  color:var(--gold-light);border:1px solid var(--gold-dim);
  border-radius:5px;padding:9px 26px;font-size:0.92rem;
  font-family:inherit;cursor:pointer;letter-spacing:1px;
  transition:all 0.18s;
}
#submit-btn:hover{
  background:linear-gradient(135deg,var(--purple-mid),var(--crimson-light));
  box-shadow:0 0 14px rgba(201,162,39,0.35);
}
</style>
</head>
<body>
<header>
  <h1><span>&#x2694;</span>The Sword of Neramar<span>&#x2694;</span></h1>
  <div id="stats">
    <span class="stat hp" id="s-hp">&#9825; Health: 100</span>
    <span class="stat ar" id="s-ar">&#x2299; Armor: 0</span>
    <span class="stat gp" id="s-gp">&#9670; Gold: 0</span>
    <span class="stat wp" id="s-wp">&#x2694; Weapon: None</span>
  </div>
</header>
<div id="output"></div>
<div id="bottom">
  <div id="choices"></div>
  <div id="input-row">
    <input type="text" id="user-input" placeholder="Type your choice, or click a button above..." autocomplete="off" spellcheck="false">
    <button id="submit-btn">Enter</button>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let inventory=[],purse=0,armor=0,names=[""],health=100;
let goblinHealth,robbersHealth,dragonHealth,orcHealth,sandwormHealth;
let krakenHealth,sandElementalHealth,iceElementalHealth,lichHealth;
let weapons=[""],states=[],amulet=[],robberDamage=20;

function resetState(){
  inventory=[];purse=0;armor=0;names=[""];health=100;
  goblinHealth=40;robbersHealth=100;dragonHealth=150;orcHealth=150;
  sandwormHealth=180;krakenHealth=200;sandElementalHealth=200;
  iceElementalHealth=200;lichHealth=400;
  weapons=[""];states=[];amulet=[];robberDamage=20;
}

// ── I/O ───────────────────────────────────────────────────────────────────────
const out=document.getElementById('output');
const choicesEl=document.getElementById('choices');
const inputEl=document.getElementById('user-input');
let resolveInput=null;

function add(text,cls='story'){
  const d=document.createElement('div');
  d.className='msg '+cls;d.textContent=text;
  out.appendChild(d);out.scrollTop=out.scrollHeight;
}

function updateStats(){
  document.getElementById('s-hp').textContent='♥ Health: '+health;
  document.getElementById('s-ar').textContent='⊛ Armor: '+armor;
  document.getElementById('s-gp').textContent='◆ Gold: '+purse;
  const w=weapons.length>1?weapons[weapons.length-1]:'None';
  document.getElementById('s-wp').textContent='⚔ '+w;
  const hel=document.getElementById('s-hp');
  hel.style.color=health>60?'#4ade80':health>30?'#fbbf24':'#f87171';
}

function showButtons(prompt){
  choicesEl.innerHTML='';
  const m=prompt.match(/\(([^)]+)\)/);
  if(!m)return;
  m[1].split('/').forEach(opt=>{
    opt=opt.trim();
    const b=document.createElement('button');
    b.className='cbtn';b.textContent=opt;
    b.onclick=()=>submit(opt);
    choicesEl.appendChild(b);
  });
}

function askQuestion(prompt){
  add(prompt,'prompt');updateStats();showButtons(prompt);
  inputEl.value='';inputEl.focus();
  return new Promise(r=>{resolveInput=r;});
}

function submit(val){
  if(!resolveInput)return;
  add('> '+val,'echo');
  const r=resolveInput;resolveInput=null;
  choicesEl.innerHTML='';inputEl.value='';
  setTimeout(()=>r(val),30);
}

document.getElementById('submit-btn').onclick=()=>{
  const v=inputEl.value.trim();if(v)submit(v);
};
inputEl.addEventListener('keypress',e=>{
  if(e.key==='Enter'){const v=inputEl.value.trim();if(v)submit(v);}
});

// ── Game ──────────────────────────────────────────────────────────────────────
async function startGame(){
  resetState();out.innerHTML='';updateStats();
  add('Welcome to The Sword of Neramar!');
  add('Your choices will affect your life! Do you have the will to prevail and attain the Sword of Neramar?');
  await instructions();
}

async function endGame(){
  const c=await askQuestion('Do you really want to quit? (yes/no)');
  if(c==='yes'){add('Thank you for playing The Sword of Neramar!','sys');add('Refresh the page to play again.','sys');}
  else if(c==='no'){add("Your adventure awaits!");const p=states.pop();if(p)await p();}
  else{add('Please make a choice.');await endGame();}
}

async function instructions(){
  add('Instructions:');
  add('1. You will be faced with a choice in every scene. Every choice has a consequence, so choose wisely!');
  add('2. If you need help at any time, type \'help\' and you will be returned to this screen.');
  add('3. You can regain health by choosing to \'camp\' or \'rest\' when the option is available!');
  add('4. You can quit at any time by typing \'quit\'!');
  const c=await askQuestion('Do you understand these instructions? (yes/no)');
  if(c==='yes'){add('Great!');await getName();}
  else if(c==='no'){add('Let\'s go over the instructions again.');await instructions();}
  else{add('Invalid choice.');await instructions();}
}

async function help(){
  add('Instructions:');
  add('1. You will be faced with a choice in every scene. Every choice has a consequence, so choose wisely!');
  add('2. If you need help at any time, type \'help\' and you will be returned to this screen.');
  add('3. You can regain health by choosing to \'camp\' or \'rest\' when the option is available!');
  add('4. You can quit at any time by typing \'quit\'!');
  if(!states.length){add('No previous state to return to.');return;}
  const a=await askQuestion('Do you understand everything? (yes/no)');
  if(a==='yes'){add('Good. Let\'s return to your adventure, '+names[names.length-1]);out.innerHTML='';const p=states.pop();await p();}
  else if(a==='no'){add('Let\'s go over the instructions once more.');await help();}
  else{add('Invalid answer!');await help();}
}

async function getName(){
  const n=await askQuestion('What is your name, brave adventurer?');
  names.push(n);add('Hello '+names[names.length-1]);await weaponChoice();
}

async function weaponChoice(){
  const c=await askQuestion('Please choose your weapon (sword/spear/bow/mace)');
  if(['sword','spear','bow','mace'].includes(c)){
    const label=c.charAt(0).toUpperCase()+c.slice(1);
    add('You have chosen the '+label+'!');weapons.push(label);
    add('Your weapon: '+weapons[weapons.length-1]);updateStats();await forest();
  }else if(c==='quit'){states.push(weaponChoice);await endGame();}
  else if(c==='help'){states.push(weaponChoice);await help();}
  else{add('Invalid choice! Please choose again!');await weaponChoice();}
}

async function forest(){
  add('You start your adventure at a lush forest full of life and greenery.');
  const c=await askQuestion('There are two paths to choose from. Which way will you go? (left/right/camp)');
  if(c==='left'){add('You go down the left path, deeper into the forest.');await goblins();}
  else if(c==='right'){add('You go down the right path toward a rocky outcropping.');await cave();}
  else if(c==='camp'){add('You make camp. Your health is restored.');health=100;updateStats();await forest();}
  else if(c==='help'){states.push(forest);await help();}
  else if(c==='quit'){states.push(forest);await endGame();}
  else{add('You must make a choice, '+names[names.length-1]+'.');await forest();}
}

async function cave(){
  add('You approach the rocky outcropping and notice something in the side of it.');
  const c=await askQuestion('It appears to be a small cave entrance! What do you do? (enter/continue/camp)');
  if(c==='enter'){add('You squeeze through the entrance and see an abandoned underground city in the distance.');await undergroundCity();}
  else if(c==='continue'){add('You decide to pass it up, though a nagging feeling tries to pull you back.');await plains();}
  else if(c==='camp'){add('You set up camp to rest.');health=100;add('Current Health: '+health);updateStats();await cave();}
  else if(c==='help'){states.push(cave);await help();}
  else if(c==='quit'){states.push(cave);await endGame();}
  else{add('A decision needs to be made!');await cave();}
}

async function undergroundCity(){
  add('You approach the city cautiously. Once you get to it, you realize it\'s empty!');
  const c=await askQuestion('Should you explore or find a way around? (explore/ignore/camp)');
  if(c==='explore'){add('You find fabulous treasure!');purse+=100;add('Gold: '+purse);updateStats();await plains();}
  else if(c==='ignore'){add('You bypass the city and find an exit.');await plains();}
  else if(c==='camp'){add('You make camp.');health=100;add('Health: '+health);updateStats();await undergroundCity();}
  else if(c==='help'){states.push(undergroundCity);await help();}
  else if(c==='quit'){states.push(undergroundCity);await endGame();}
  else{add('You need to make a choice, '+names[names.length-1]);await undergroundCity();}
}

async function goblins(){
  add('You walk for an hour before three Goblins leap from the bushes, ready to fight!');
  const c=await askQuestion('What do you do? (fight/run/surrender)');
  if(c==='fight'){add('Prepare yourself, '+names[names.length-1]+'!');await goblinFight();}
  else if(c==='run'){add('You barely escape with your life!');health-=20;add('Health: '+health);updateStats();await forest();}
  else if(c==='surrender'){add('The Goblins only accept your death!');await death();}
  else if(c==='help'){states.push(goblins);await help();}
  else if(c==='quit'){states.push(goblins);await endGame();}
  else{add('Now is not the time for indecision!');await goblins();}
}

async function death(){
  add('You have tragically died!','die');
  const c=await askQuestion('Would you like to try again? (yes/no)');
  if(c==='yes')await startGame();
  else if(c==='no')add('Thank you for playing The Sword of Neramar!','sys');
  else await death();
}

async function goblinFight(){
  if(goblinHealth<=0){add('You are victorious! You loot their slain bodies!','win');purse+=20;add('Gold: '+purse);updateStats();await plains();return;}
  if(health<=0){await death();return;}
  const c=await askQuestion('The Goblins look fierce! What will you do? (attack/defend/run)');
  if(c==='attack'){add('Great hit! They counter attack!');goblinHealth-=20;health-=10;add('Health: '+health+' | Goblin HP: '+goblinHealth);updateStats();await goblinFight();}
  else if(c==='defend'){add('You block most of it!');health-=5;add('Health: '+health);updateStats();await goblinFight();}
  else if(c==='run'){add('You escape with only a scratch!');health-=10;updateStats();await forest();}
  else{add('Quick! Make a choice!');await goblinFight();}
}

async function plains(){
  const c=await askQuestion('You emerge from the forest to beautiful plains. There\'s a small village in the distance. (village/ignore/camp)');
  if(c==='village'){add('You approach the bustling village.');await smallVillage();}
  else if(c==='ignore'){add('You travel onwards in search of more interesting things.');await ruins();}
  else if(c==='camp'){add('You make camp.');health=100;add('Health: '+health);updateStats();await plains();}
  else if(c==='help'){states.push(plains);await help();}
  else if(c==='quit'){states.push(plains);await endGame();}
  else{add('You must make a choice!');await plains();}
}

async function smallVillage(){
  const c=await askQuestion('You enter the bustling village. What should you do? (explore/shop/rest)');
  if(c==='explore'){add('A panicked villager approaches you.');await robberQuest();}
  else if(c==='shop'){add('You approach a well-stocked adventurer\'s shop.');await shopMenu(smallVillage);}
  else if(c==='rest'){
    if(purse>=10){add('You buy a room at the inn and rest.');health=100;purse-=10;add('Health: '+health+' | Gold: '+purse);updateStats();await smallVillage();}
    else{add('You can\'t afford the inn (costs 10 gold)!');await smallVillage();}
  }
  else if(c==='help'){states.push(smallVillage);await help();}
  else if(c==='quit'){states.push(smallVillage);await endGame();}
  else{add('Make a choice!');await smallVillage();}
}

async function shopMenu(returnFn,free=false){
  if(free)add('Everything is free!');
  else add('Prices: 20 Gold for health potion | 50 Gold for armor');
  const c=await askQuestion('What would you like to buy? (health/armor/leave)');
  if(c==='health'){
    if(free||purse>=20){add('You feel refreshed!');health=100;if(!free)purse-=20;add('Health: '+health+' | Gold: '+purse);updateStats();await shopMenu(returnFn,free);}
    else{add('Not enough gold!');await shopMenu(returnFn,free);}
  }else if(c==='armor'){
    if(free||purse>=50){add('You purchase some armor!');armor+=50;if(!free)purse-=50;add('Armor: '+armor+' | Gold: '+purse);updateStats();await shopMenu(returnFn,free);}
    else{add('Not enough gold!');await shopMenu(returnFn,free);}
  }else if(c==='leave'){add('You continue on your way.');await returnFn();}
  else if(c==='help'){states.push(()=>shopMenu(returnFn,free));await help();}
  else if(c==='quit'){states.push(()=>shopMenu(returnFn,free));await endGame();}
  else{add('Don\'t waste the shopkeeper\'s time!');await shopMenu(returnFn,free);}
}

async function robberQuest(){
  add('The villager tells you there are robbers on the outskirts of town!');
  const c=await askQuestion('He offers 100 Gold to clear them out. Do you accept? (yes/no)');
  if(c==='yes'){add('The villager looks relieved. You head out with your '+weapons[weapons.length-1]+' ready.');await villageQuest();}
  else if(c==='no'){add('The villager spits at your feet before stomping away.');await smallVillageCoward();}
  else if(c==='help'){states.push(robberQuest);await help();}
  else if(c==='quit'){states.push(robberQuest);await endGame();}
  else{add('The villager begs you to decide!');await robberQuest();}
}

async function villageQuest(){
  add('You approach a barricade guarded by four armed robbers.');
  const c=await askQuestion('They look ready to fight. What do you do? (fight/run/surrender)');
  if(c==='fight'){add('Prepare yourself, '+names[names.length-1]+'!');await robbersFight();}
  else if(c==='run'){
    add('You escape, but must face the villagers.');
    applyDamage(20);add('Health: '+health+' | Armor: '+armor);updateStats();await smallVillageRun();
  }
  else if(c==='surrender'){add('The Robbers show no mercy. You are killed.');await death();}
  else if(c==='help'){states.push(villageQuest);await help();}
  else if(c==='quit'){states.push(villageQuest);await endGame();}
  else{add('Hurry and make a choice!');await villageQuest();}
}

function applyDamage(dmg){
  if(armor>=dmg){armor-=dmg;}
  else if(dmg>armor){const r=dmg-armor;armor=0;health-=r;}
  else{health-=dmg;}
}

async function robbersFight(){
  if(robbersHealth<=0){add('You are victorious!','win');purse+=40;add('Gold: '+purse);updateStats();await smallVillageWin();return;}
  if(health<=0){await death();return;}
  const c=await askQuestion('What will you do? (attack/defend/run)');
  if(c==='attack'){
    add('You deal damage! They counter attack!');robbersHealth-=20;add('Robber HP: '+robbersHealth);
    applyDamage(robberDamage);add('Health: '+health+' | Armor: '+armor);updateStats();await robbersFight();
  }else if(c==='defend'){
    add('You block most of the attacks.');applyDamage(10);add('Health: '+health+' | Armor: '+armor);updateStats();await robbersFight();
  }else if(c==='run'){
    add('You run in shame and must face the village.');applyDamage(robberDamage);add('Health: '+health+' | Armor: '+armor);updateStats();await smallVillageRun();
  }else{add('Make a decision! They want your head!');await robbersFight();}
}

async function smallVillageWin(){
  add('The village erupts in cheers! The grateful villager pays you 100 Gold.');
  purse+=100;add('Gold: '+purse);updateStats();await smallVillageContinue();
}
async function smallVillageRun(){
  add('You return to the village with your head hung low. The villagers refuse to speak to you.');
  await smallVillageCoward();
}
async function smallVillageCoward(){
  const c=await askQuestion('You must leave before they run you off. (leave)');
  if(c==='leave'){add('You quickly leave the village.');await ruins();}
  else await smallVillageCoward();
}
async function smallVillageContinue(){
  const c=await askQuestion('The celebration dies down. What will you do? (leave/shop/rest)');
  if(c==='leave'){add('You leave to explore further.');await ruins();}
  else if(c==='shop'){await shopMenu(smallVillageContinue);}
  else if(c==='rest'){
    add('You rest at the inn.');purse-=10;health=100;add('Gold: '+purse+' | Health: '+health);updateStats();await smallVillageContinue();
  }
  else if(c==='help'){states.push(smallVillageContinue);await help();}
  else if(c==='quit'){states.push(smallVillageContinue);await endGame();}
  else{add('You still need to make a choice.');await smallVillageContinue();}
}

async function ruins(){
  add('You spot some dark ruins along the winding road.');
  const c=await askQuestion('Do you enter, or go around and play it safe? (enter/continue/camp)');
  if(c==='enter'){add('You enter and immediately find 40 Gold Coins!');purse+=40;add('Gold: '+purse);updateStats();await dragon();}
  else if(c==='continue'){add('You play it safe and circle around.');await pathMerchant();}
  else if(c==='camp'){add('You make camp.');health=100;updateStats();await ruins();}
  else if(c==='help'){states.push(ruins);await help();}
  else if(c==='quit'){states.push(ruins);await endGame();}
  else{add('You must make a choice!');await ruins();}
}

async function dragon(){
  add('You carefully explore the ruins and stumble across a Dragon!');
  const c=await askQuestion('Do you sneak away, or fight the Dragon? (fight/run)');
  if(c==='fight'){add('Prepare yourself, '+names[names.length-1]+'!');await dragonFight();}
  else if(c==='run'){add("The Dragon doesn't notice you as you slip away.");await pathMerchant();}
  else if(c==='help'){states.push(dragon);await help();}
  else if(c==='quit'){states.push(dragon);await endGame();}
  else{add('Hurry! The Dragon could notice you at any moment!');await dragon();}
}

async function dragonFight(){
